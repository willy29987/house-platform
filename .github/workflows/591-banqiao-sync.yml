name: 591 Banqiao suite sync

on:
  schedule:
    # 每 2 小時（UTC）；對應台北約偶數整點
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Banqiao 591 sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SYNC_URL: ${{ secrets.BANQIAO_SYNC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET"
            exit 1
          fi
          URL="${SYNC_URL:-https://house-platform.vercel.app/api/cron/591-banqiao-sync}"
          code=$(curl -sS -o /tmp/sync.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$URL")
          echo "HTTP $code"
          head -c 2000 /tmp/sync.json || true
          echo
          test "$code" = "200"
