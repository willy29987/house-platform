<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LINE 氣泡預覽｜挑選看屋時間</title>
<style>
  html,body{margin:0;background:#748190;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;}
  .wrap{max-width:420px;margin:40px auto;padding:16px;}
  .label{color:#fff;font-size:13px;margin:0 0 10px;opacity:.9}
  /* Simulate LINE flex kilo bubble rounding */
  .bubble{
    width:260px;
    border-radius:20px;
    overflow:hidden;
    background:#0b2545;
    box-shadow:0 1px 2px rgba(0,0,0,.18);
  }
  .bubble img{display:block;width:100%;height:auto;}
  .phone{width:390px;max-width:100%;margin:0 auto;background:#6b7785;border-radius:28px;padding:28px 18px 40px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <p class="label">LINE 氣泡預覽（圓角裁切）</p>
      <div class="bubble">
        <img src="/line/pick-viewing-time.png?v=6" alt="挑選看屋時間"/>
      </div>
    </div>
  </div>
</body>
</html>
